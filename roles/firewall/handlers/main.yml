---
- name: Systemd daemon-reload
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable docker-user-hardening
  ansible.builtin.systemd:
    name: docker-user-hardening.service
    enabled: true
    state: started

- name: Apply DOCKER-USER rules
  ansible.builtin.command: /usr/local/sbin/docker-user-hardening.sh
  changed_when: true
