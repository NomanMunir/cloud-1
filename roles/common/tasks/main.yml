---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - ufw
      - python3-pip
      - python3-docker
      - unattended-upgrades
      - chrony
      - htop
      - net-tools
      - jq
    state: present
    update_cache: true

- name: Set timezone to UTC
  community.general.timezone:
    name: UTC

- name: Enable + start chrony
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true

- name: Configure unattended security upgrades
  ansible.builtin.copy:
    src: 50unattended-upgrades.conf
    dest: /etc/apt/apt.conf.d/50unattended-upgrades-cloud1
    owner: root
    group: root
    mode: "0644"
  notify: reload unattended-upgrades

- name: Ensure swap exists (2G) for low-RAM instances
  block:
    - name: Check for existing swapfile
      ansible.builtin.stat:
        path: /swapfile
      register: swapfile_stat

    - name: Create swapfile
      ansible.builtin.command: fallocate -l 2G /swapfile
      args:
        creates: /swapfile
      when: not swapfile_stat.stat.exists

    - name: Set swapfile permissions
      ansible.builtin.file:
        path: /swapfile
        owner: root
        group: root
        mode: "0600"

    # mkswap refuses to touch a mounted swapfile and swapon rejects a second
    # activation, so gate both on the real state instead of parsing their
    # error text — that is what broke idempotency on the second run.
    - name: Read active swap devices
      ansible.builtin.command: cat /proc/swaps
      register: active_swaps
      changed_when: false

    - name: Format swapfile
      ansible.builtin.command: mkswap /swapfile
      when: not swapfile_stat.stat.exists
      changed_when: true

    - name: Enable swap (current session)
      ansible.builtin.command: swapon /swapfile
      when: "'/swapfile' not in active_swaps.stdout"
      changed_when: true

    - name: Persist swap in fstab
      ansible.posix.mount:
        name: none
        src: /swapfile
        fstype: swap
        opts: sw
        state: present

# The subject's defense step is `ssh root@<host>`. Cloud images ship with root
# login disabled, so enable it explicitly — key-only, never by password.
- name: Enable key-only root SSH for evaluation defense
  when: enable_root_ssh | bool
  block:
    - name: Authorize the deploy key for root
      ansible.posix.authorized_key:
        user: root
        key: "{{ lookup('file', root_ssh_public_key_file) }}"
        state: present

    - name: Permit root login with key only
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: "PermitRootLogin prohibit-password"
        validate: "/usr/sbin/sshd -t -f %s"
      notify: restart sshd

    - name: Keep password authentication disabled
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: "PasswordAuthentication no"
        validate: "/usr/sbin/sshd -t -f %s"
      notify: restart sshd

    - name: Drop cloud-init SSH overrides that re-disable root
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-cloud1.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          PermitRootLogin prohibit-password
          PasswordAuthentication no
      notify: restart sshd
