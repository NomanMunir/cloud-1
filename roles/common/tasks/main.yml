---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - ufw
      - python3-pip
      - python3-docker
      - unattended-upgrades
      - chrony
      - htop
      - net-tools
      - jq
    state: present
    update_cache: true

- name: Set timezone to UTC
  community.general.timezone:
    name: UTC

- name: Enable + start chrony
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true

- name: Configure unattended security upgrades
  ansible.builtin.copy:
    src: 50unattended-upgrades.conf
    dest: /etc/apt/apt.conf.d/50unattended-upgrades-cloud1
    owner: root
    group: root
    mode: "0644"
  notify: reload unattended-upgrades

- name: Ensure swap exists (1G) for low-RAM instances
  block:
    - name: Check for existing swapfile
      ansible.builtin.stat:
        path: /swapfile
      register: swapfile_stat

    - name: Create swapfile
      ansible.builtin.command: fallocate -l 1G /swapfile
      args:
        creates: /swapfile
      when: not swapfile_stat.stat.exists

    - name: Set swapfile permissions
      ansible.builtin.file:
        path: /swapfile
        owner: root
        group: root
        mode: "0600"

    - name: Format swapfile
      ansible.builtin.command: mkswap /swapfile
      register: mkswap_result
      changed_when: "'Setting up swapspace' in mkswap_result.stdout"
      failed_when:
        - mkswap_result.rc != 0
        - "'already' not in mkswap_result.stderr"

    - name: Enable swap (current session)
      ansible.builtin.command: swapon /swapfile
      register: swapon_result
      changed_when: swapon_result.rc == 0
      failed_when:
        - swapon_result.rc != 0
        - "'already' not in swapon_result.stderr | default('')"

    - name: Persist swap in fstab
      ansible.posix.mount:
        name: none
        src: /swapfile
        fstype: swap
        opts: sw
        state: present
