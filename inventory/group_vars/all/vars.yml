---
# ==============================================================================
# Cloud-1 Non-Sensitive Variables
# ==============================================================================

# System Configuration
system_timezone: "UTC"
system_packages:
  - curl
  - git
  - ufw
  - gnupg
  - ca-certificates
  - lsb-release
  - python3
  - python3-pip
  - openssl
  - net-tools
  - apt-transport-https

# Firewall (UFW) Configuration
# Strictly allow only ports 22, 80, 443
ssh_port: 22
ufw_rules:
  - port: "{{ ssh_port }}"
    proto: "tcp"
    rule: "allow"
    comment: "SSH access"
  - port: "80"
    proto: "tcp"
    rule: "allow"
    comment: "HTTP access for Nginx (redirected to HTTPS)"
  - port: "443"
    proto: "tcp"
    rule: "allow"
    comment: "HTTPS access for Nginx TLS termination"

# Deployment Directory on Target Server
app_dir: "/opt/cloud-1"
app_certs_dir: "{{ app_dir }}/certs"
app_nginx_dir: "{{ app_dir }}/nginx"
app_network_name: "cloud1_network"

# Domain & TLS Configuration
# Replace with your public IP, domain, or DuckDNS domain (e.g. "myblog.duckdns.org")
server_domain: "192.168.56.101"
server_admin_email: "admin@example.com"
tls_cert_file: "{{ app_certs_dir }}/server.crt"
tls_key_file: "{{ app_certs_dir }}/server.key"
tls_country: "FR"
tls_state: "IDF"
tls_locality: "Paris"
tls_organization: "42"
tls_organizational_unit: "Cloud-1"
tls_common_name: "{{ server_domain }}"

# Docker Configuration
docker_apt_arch: "amd64"
docker_compose_plugin_package: "docker-compose-plugin"

# Container Images (Official Docker Images as specified in subject)
nginx_image: "nginx:1.25-alpine"
wordpress_image: "wordpress:6.4-apache"
mariadb_image: "mariadb:10.11"
phpmyadmin_image: "phpmyadmin:5.2-apache"

# Service Configuration
db_name: "wordpress"
db_user: "wp_user"
# Passwords are defined in vault.yml to prevent hard-coding secrets!
