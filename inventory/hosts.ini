# ==============================================================================
# Cloud-1 Inventory Configuration
# Supports single-server or multi-server parallel deployment
# ==============================================================================

[webservers]
# Target server 1 (Primary instance)
server1 ansible_host=192.168.56.101 ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa ansible_port=22

# Target server 2 (Uncomment to deploy in parallel to multiple servers)
# server2 ansible_host=YOUR_SECOND_SERVER_IP ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa ansible_port=22
    
[webservers:vars]
ansible_python_interpreter=/usr/bin/python3

[all:children]
webservers
